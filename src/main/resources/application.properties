# ResortsLite - Application Configuration
spring.application.name=ResortsLite

# Server port — externalised to environment variable; defaults to 8080 for local development.
# Container orchestration (ECS/EKS) overrides this via PORT environment variable.
server.port=${PORT:8080}

# ─── PostgreSQL 16 DataSource ────────────────────────────────────────────────
# Connection URL, credentials, and pool settings are externalised to environment
# variables so that no sensitive values are stored in source control.
# Set the following environment variables (or AWS Parameter Store / Secrets Manager):
#   DB_HOST     — PostgreSQL host (e.g. my-cluster.rds.amazonaws.com)
#   DB_PORT     — PostgreSQL port (default 5432)
#   DB_NAME     — Database / schema name
#   DB_USER     — Database username
#   DB_PASSWORD — Database password
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resortdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── Connection Pool (HikariCP) ──────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ─── External Service Endpoints ──────────────────────────────────────────────
# Externalised to environment variables — no hardcoded hostnames in source code.
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}
