# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# FIXED cr-java-0077: Port now retrieved from environment variable or AWS Parameter Store
# Supports dynamic port assignment by ECS, EKS, and Elastic Beanstalk
# In AWS environments, set SERVER_PORT environment variable or use AWS Systems Manager Parameter Store
# Example Parameter Store path: /resortslite/${environment}/server-port
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# FIXED cr-java-0071: Environment-specific URLs externalized to AWS Systems Manager Parameter Store
# These values should be retrieved from Parameter Store at runtime for environment-agnostic deployment
# In production, use AWS Systems Manager Parameter Store or environment variables
# Example Parameter Store paths:
#   /resortslite/dev/payment-endpoint
#   /resortslite/dev/inventory-endpoint
#   /resortslite/dev/reports-baseurl
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc.internal:8081}
app.reports.download.baseurl=${REPORTS_BASEURL:http://reports.resorts-internal.com:8080}

# AWS S3 Configuration for cloud-native file storage
# Replace hard-coded file paths with S3 bucket storage
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:resorts-lite-reports}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.reports.prefix=reports/
aws.s3.backups.prefix=backups/

# FIXED cr-java-0065: Spring Session with Amazon ElastiCache for Redis
# Distributed session management enables stateless application instances
# Session data is stored in Redis cluster, accessible by all EC2/ECS/EKS instances
# Supports horizontal scaling, auto-scaling, and load balancing without session affinity
spring.session.store-type=redis
spring.session.redis.namespace=spring:session
spring.session.timeout=1800s

# Amazon ElastiCache for Redis Configuration
# In production, use ElastiCache cluster endpoint from AWS Parameter Store or environment variables
# Example: resortslite-session-cache.abc123.0001.use1.cache.amazonaws.com:6379

# FIXED cr-java-0067: Redis Cache Configuration with TTL
# Replaces unbounded in-memory caching with Amazon ElastiCache for Redis
# Provides controlled expiration, consistent data across instances, and centralized cache management
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=resortslite:cache:
spring.cache.redis.use-key-prefix=true

aws.cognito.userPoolId=${AWS_COGNITO_USER_POOL_ID:}
aws.cognito.clientId=${AWS_COGNITO_CLIENT_ID:}
aws.cognito.region=${AWS_REGION:us-east-1}

aws.region=${AWS_REGION:us-east-1}

